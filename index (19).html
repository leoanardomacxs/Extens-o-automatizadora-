<style>

const V=k=>E(lcat)[k],U=(k,v)=>{v=clampK(k,v);if(v===null){render();return}setK(k,v);change()},toast=(t,ms=6000)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',ms)};

function catSz(v){const c=P.cats.find(x=>x.id===curCat);if(!v)delete c.size;else if(v==='custom')c.size=c.size||[P.set.cw,P.set.ch];else c.size=[...SZ[v]];change()}

function catAct(a){if(a==='add'){const n=prompt('Nome da categoria:');if(n){const id=uid();P.cats.push({id,name:n});curCat=id;change()}}else{const c=P.cats.find(x=>x.id===curCat);if(a==='ren'){const n=prompt('Novo nome:',c.name);if(n){c.name=n;change()}}if(a==='del'&&confirm('Excluir categoria? As cartas ficam sem categoria.')){P.cards.forEach(k=>{if(k.cat===c.id)k.cat=''});P.cats=P.cats.filter(x=>x!==c);curCat='all';change()}}}
function bulk(a,v){const S=P.cards.filter(k=>sel.has(k.id));if(!S.length||v==='?')return toast('Selecione cartas primeiro.');
 if(a==='cat')S.forEach(k=>k.cat=v);if(a==='fit')S.forEach(k=>k.fit=v);if(a==='rot')S.forEach(k=>k.rot=((k.rot||0)+v)%360);if(a==='copies'){const n=prompt('Cópias de cada carta selecionada:',1);if(n===null)return;S.forEach(k=>k.copies=Math.max(0,+n|0))}
 if(a==='dup')S.forEach(k=>{const id=uid();B[id]=B[k.id];P.cards.push({...k,id,name:k.name+' (cópia)'})});
 if(a==='rename'){const p=prompt('Prefixo (será numerado: prefixo 1, prefixo 2…):');if(!p)return;S.forEach((k,i)=>k.name=p+' '+(i+1))}
 if(a==='ref'){if(S.length!==1)return toast('Selecione exatamente uma carta.');P.set.ref=S[0].id;P.set.refW=P.set.cw}
 if(a==='del'){if(!confirm('Excluir '+S.length+' carta(s)?'))return;P.cards=P.cards.filter(k=>!sel.has(k.id));sel.clear()}change()}
function stats(){const s=P.set,pls=pageList(),n=items().length,L=planOf(s).L,sz=[...new Set(pls.map(p=>p.cw+'×'+p.ch))];let used=0;pls.forEach(p=>used+=p.it.length*p.cw*p.ch);let tot=0;pls.forEach(p=>tot+=p.L.W*p.L.H);const nt=[...new Set(pls.flatMap(p=>p.notes||[]))];

function prevBar(pages){return`<div class="row pbar"><button onclick="pg=Math.max(0,pg-1);render()">◀</button><b class="pnum">Folha ${pg+1}/${pages}</b><button onclick="pg=Math.min(${pages-1},pg+1);render()">▶</button>
 <button class="${side==='front'?'p':''}" onclick="side='front';render()">Frente</button><button class="${side==='back'?'p':''}" onclick="side='back';render()">Verso</button>

const th=id=>{let t=TH[id];if(t===undefined){t=TH[id]=null;const i=new Image;i.onload=()=>{TH[id]=i;drawPrev()};i.src=B[id]?.thumb||''}return t};
function drawPrev(){const c=$('#cv');if(!c)return;const pls=pageList(),pages=Math.max(1,pls.length);pg=Math.min(pg,pages-1);const s=pls[pg]?pls[pg].s:P.set,L=pls[pg]?pls[pg].L:layout(s),cw=520*zoom,k=cw/L.W,r=devicePixelRatio||1;
 c.width=cw*r;c.height=L.H*k*r;c.style.width=cw+'px';c.style.height=L.H*k+'px';const x=c.getContext('2d');x.scale(r,r);x.fillStyle='#fff';x.fillRect(0,0,cw,L.H*k);x.strokeStyle='#e5a';x.setLineDash([3,3]);x.lineWidth=.5;x.strokeRect(s.ml*k,s.mt*k,L.aw*k,L.ah*k);x.setLineDash([]);
 if(pls[pg]?!pls[pg].L.fits:!L.fits){x.fillStyle='#c2255c';x.font='13px sans-serif';x.fillText('As cartas não cabem nesta configuração (veja Verificação).',10,24);return}
 for(const sl of slots(pg,side,0,pls)){const w=sl.w*k,h=sl.h*k,X=sl.x*k,Y=sl.y*k,m=sl.img&&B[sl.img],t=m&&th(sl.img);x.save();x.beginPath();cpath(x,X,Y,sl,s,k,1);x.clip();x.fillStyle='#e6e8ee';x.fillRect(X,Y,w,h);
  if(t){const[iw,ih]=dim(sl.img,sl.rot),[a,b,dw,dh]=fitRect(iw,ih,X,Y,w,h,side==='front'?sl.k.fit||s.fit:s.fit),qq=sl.rot%180;x.save();x.translate(a+dw/2,b+dh/2);x.rotate(sl.rot*Math.PI/180);x.drawImage(t,-(qq?dh:dw)/2,-(qq?dw:dh)/2,qq?dh:dw,qq?dw:dh);x.restore()}else if(!sl.img){x.fillStyle='#889';x.font='12px sans-serif';x.textAlign='center';x.fillText('sem verso',X+w/2,Y+h/2)}if(sl.img)decoCv(x,X,Y,sl,sl.s,k,side);x.restore();
  x.strokeStyle='#778';x.lineWidth=.6;x.beginPath();cpath(x,X,Y,sl,s,k,0);x.stroke();
  if(s.ids){x.fillStyle='#000a';x.fillRect(X+2,Y+2,26,16);x.fillStyle='#fff';x.font='bold 12px sans-serif';x.textAlign='left';x.fillText(sl.n,X+5,Y+14)}
  if(side==='front'&&s.marks){x.strokeStyle='#000';x.lineWidth=.5;mk(X,Y,w,h,(a,b,c2,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.stroke()}),0}}}
