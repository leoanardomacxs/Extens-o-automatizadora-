<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Mapas Hexagonais</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1821;--pn:#14232f;--pn2:#1c3142;--ln:#2b4559;--tx:#e9e3d1;--mut:#8ea4b2;--ac:#d9a441;--ok:#4fb39b;--bad:#e5604f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:2px solid var(--ac);flex-wrap:wrap}
header h1{font:700 17px Cinzel,Georgia,serif;margin:0 auto 0 0;letter-spacing:.04em}
#saved{font-size:12px;color:var(--mut)}
main{flex:1;display:grid;grid-template-columns:340px 1fr 260px;min-height:0}
aside{background:var(--pn);overflow:auto;min-height:0}
#left{border-right:1px solid var(--ln)}
#right{border-left:1px solid var(--ln);padding:12px}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;position:sticky;top:0;background:var(--pn);z-index:2;border-bottom:1px solid var(--ln)}
#tabs button{flex:1 1 28%}
#tabs button.on,.tool.on{background:var(--ac);color:#1a1405;border-color:var(--ac)}
#panel{padding:10px 12px 60px}
#stage{position:relative;min-width:0;min-height:0;background:#0a1219}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drop,.zone.drop{outline:3px dashed var(--ac);outline-offset:-3px}
#tb{position:absolute;left:10px;bottom:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
#tb>*{pointer-events:auto}
#tb select{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px}
button{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);color:#1a1405;border-color:var(--ac);font-weight:600}
button.dan{color:var(--bad)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.f span{color:var(--mut);flex:1}
.f input:not([type=checkbox]):not([type=color]),.f select,.f textarea,.txt{width:130px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:5px;padding:4px 6px;font:inherit}
.f textarea{width:100%;min-height:50px}
.f.col{flex-direction:column;align-items:stretch}
.f input[type=color]{width:44px;height:28px;border:1px solid var(--ln);background:none;padding:0}
h3{font:700 13px Cinzel,Georgia,serif;margin:16px 0 6px;color:var(--ac);letter-spacing:.04em}
.note{color:var(--mut);font-size:12px;margin:6px 0}
.note b{color:var(--tx)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.card{border:1px solid var(--ln);border-radius:8px;padding:8px;margin:10px 0;background:#10202c}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}
.var{border-top:1px dashed var(--ln);margin-top:8px;padding-top:6px}
.zone{width:58px;height:58px;border:1px dashed var(--mut);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--mut);cursor:pointer;background:#000 center/contain no-repeat;position:relative}
.zone span{background:#000b;padding:1px 3px;border-radius:3px}
.th{width:34px;height:34px;object-fit:cover;border:1px solid var(--ln);border-radius:4px;background:#000}
.lay{display:flex;gap:6px;align-items:center;padding:5px;border:1px solid var(--ln);border-radius:6px;margin:4px 0;cursor:pointer}
.lay.on{border-color:var(--ac);background:#1c3142}
.lay b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
#toasts{position:fixed;right:12px;top:60px;display:flex;flex-direction:column;gap:6px;z-index:50;max-width:min(420px,90vw)}
.toast{background:#1c3142;border:1px solid var(--ln);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px;box-shadow:0 4px 18px #0008}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
#prog{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:60}
#prog>div{background:var(--pn);border:1px solid var(--ac);border-radius:10px;padding:18px;width:min(420px,90vw)}
#prog .bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:10px 0}
#prog .bar i{display:block;height:100%;width:0;background:var(--ac)}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ac);border-radius:10px;padding:18px;max-width:min(440px,92vw)}
dialog::backdrop{background:#000a}
@media(max-width:1000px){main{display:flex;flex-direction:column;overflow:auto}#stage{order:-1;flex:none;height:52vh;min-height:300px;position:sticky;top:0;z-index:3}aside{flex:none;overflow:visible}#tabs{position:static}#left{border-right:0}#right{border-left:0;border-top:1px solid var(--ln)}}
</style>
</head>
<body>
<header>
  <h1>Gerador de Mapas Hexagonais</h1>
  <span id="saved"></span>
  <button id="bNew">Novo</button>
  <button id="bUndo" title="Ctrl+Z">Desfazer</button>
  <button id="bRedo" title="Ctrl+Y">Refazer</button>
  <button id="bSave" title="Ctrl+S">Salvar projeto</button>
  <button id="bOpen">Abrir projeto</button>
  <button id="bExp" class="pri">Exportar</button>
</header>
<main>
  <aside id="left"><div id="tabs"></div><div id="panel"></div></aside>
  <section id="stage">
    <canvas id="cv"></canvas>
    <div id="tb">
      <button id="zFit">Ajustar</button><button id="zIn">+</button><button id="zOut">−</button>
      <button class="tool" data-t="hand" title="Mover o mapa / selecionar">Mão</button>
      <button class="tool" data-t="rect" title="Selecionar vários arrastando">Seleção</button>
      <button class="tool" data-t="brush" title="Pintar hexágonos">Pincel</button>
      <button class="tool" data-t="edge" title="Clique numa aresta de hexágono ou de borda para destacar com neon">Aresta</button>
      <select id="brushSel" title="Categoria do pincel"></select>
      <button id="zBack">Ver verso</button>
    </div>
  </section>
  <aside id="right"><div id="sel"></div></aside>
</main>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="prog"><div><b id="progT">Gerando…</b><div class="bar"><i id="progB"></i></div><div class="note" id="progS"></div><button id="progC">Cancelar</button></div></div>
<dialog id="dlgNew"><b>Começar um projeto novo</b><p class="note">O projeto atual será substituído. Use "Salvar projeto" antes se quiser guardá-lo. As imagens já importadas continuam disponíveis.</p>
  <div class="row"><button data-tpl="pirata" class="pri">Modelo Pirata</button><button data-tpl="catan">Modelo 19 hexágonos</button><button data-tpl="vazio">Mapa vazio</button><button id="dlgX">Cancelar</button></div></dialog>
<input type="file" id="fileIn" hidden>

<script>
"use strict";
/* ================= utilidades ================= */
const $=(s,e=document)=>e.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const D2R=Math.PI/180,SQ3=Math.sqrt(3);
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8,c=0){c=~c>>>0;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&255]^(c>>>8);return(~c)>>>0}
function toast(m,type='',ms=5500){const t=el('div','toast '+type,m);$('#toasts').append(t);setTimeout(()=>t.remove(),ms)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},120000)}
const blobOf=(c,t,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Não foi possível codificar a imagem (memória insuficiente?)')),t,q));
async function deflate(u8){const cs=new CompressionStream('deflate'),w=cs.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
async function inflateRaw(u8){const cs=new DecompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer())}
addEventListener('error',e=>toast('Erro inesperado: '+esc(e.message),'bad'));
addEventListener('unhandledrejection',e=>{if(!e.reason||e.reason==='cancel'){e.preventDefault();return}toast('Erro: '+esc(e.reason.message||e.reason),'bad')});

/* ================= armazenamento local (IndexedDB) ================= */
let _db=null,persistOK=true;
function idb(){return _db||(_db=new Promise((res,rej)=>{try{const r=indexedDB.open('hexmap2',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('assets')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))}
async function idbDo(store,mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const r=fn(tx.objectStore(store));tx.oncomplete=()=>res(r&&r.result);tx.onerror=tx.onabort=()=>rej(tx.error)})}
const kvSet=(k,v)=>idbDo('kv','readwrite',s=>s.put(v,k)),kvGet=k=>idbDo('kv','readonly',s=>s.get(k));
const asSet=r=>idbDo('assets','readwrite',s=>s.put(r,r.id)),asDel=id=>idbDo('assets','readwrite',s=>s.delete(id)),asAll=()=>idbDo('assets','readonly',s=>s.getAll()),asClear=()=>idbDo('assets','readwrite',s=>s.clear());
function setSaved(ok){persistOK=ok;$('#saved').textContent=ok?'Salvo neste navegador':'Autosave indisponível: use Salvar projeto';$('#saved').style.color=ok?'':'var(--bad)'}
let saveT=0;
function autosave(){clearTimeout(saveT);saveT=setTimeout(async()=>{try{await kvSet('state',JSON.stringify(S));setSaved(true)}catch(e){setSaved(false)}},600)}

/* ================= imagens e fontes ================= */
const IM={};      // id -> {id,name,type,blob,w,h,url,img,th,key,kind,family}
let ORIG=false,NEEDPX=0;
function getImg(id){
  const m=IM[id];if(!m||!m.img)return null;
  if(ORIG||Math.max(m.w,m.h)<=1100||NEEDPX>700)return m.img;
  if(!m.th){const k=1024/Math.max(m.w,m.h),c=document.createElement('canvas');c.width=Math.max(1,Math.round(m.w*k));c.height=Math.max(1,Math.round(m.h*k));const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(m.img,0,0,c.width,c.height);m.th=c}
  return m.th}
async function loadImgEl(blob){const url=URL.createObjectURL(blob),img=new Image();img.src=url;try{await img.decode()}catch(e){URL.revokeObjectURL(url);throw e}return{img,url}}
async function rasterSvg(file){
  const txt=await file.text(),doc=new DOMParser().parseFromString(txt,'image/svg+xml'),svg=doc.documentElement;
  if(!svg||svg.nodeName.toLowerCase()!=='svg')throw new Error('SVG inválido');
  const vb=(svg.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);let w=parseFloat(svg.getAttribute('width')),h=parseFloat(svg.getAttribute('height'));
  if(!(w>0&&h>0)){if(vb.length===4&&vb[2]>0&&vb[3]>0){w=vb[2];h=vb[3]}else{w=h=1024}}
  const k=2048/Math.max(w,h);svg.setAttribute('width',Math.round(w*k));svg.setAttribute('height',Math.round(h*k));
  if(!svg.getAttribute('viewBox'))svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const b=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),{img,url}=await loadImgEl(b);
  const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return blobOf(c,'image/png')}
async function registerImage(id,blob,name,key,persist=true){
  if(IM[id]&&IM[id].url)URL.revokeObjectURL(IM[id].url);
  const{img,url}=await loadImgEl(blob);if(!img.naturalWidth)throw new Error('imagem sem dimensões');
  IM[id]={id,name,type:blob.type,blob,w:img.naturalWidth,h:img.naturalHeight,url,img,th:null,key};
  if(persist)try{await asSet({id,name,type:blob.type,blob,w:img.naturalWidth,h:img.naturalHeight,key})}catch(e){setSaved(false)}
  return id}
async function addFile(file){
  const name=file.name||'imagem',key=[name,file.size,file.lastModified].join('|');
  for(const id in IM)if(IM[id].key===key&&!IM[id].kind)return id;
  if(file.size>300*1024*1024)throw new Error(`"${name}" tem mais de 300 MB`);
  let blob=file;const isSvg=/svg/i.test(file.type)||/\.svg$/i.test(name);
  try{
    if(isSvg)blob=await rasterSvg(file);
    else if(!/^image\//.test(file.type)&&!/\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(name))throw new Error('tipo não suportado');
    const{img,url}=await loadImgEl(blob);const mx=S.opt.maxImg,big=Math.max(img.naturalWidth,img.naturalHeight);
    if(mx>0&&big>mx){
      const k=mx/big,c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
      const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);
      blob=await blobOf(c,/jpe?g/i.test(blob.type)?'image/jpeg':'image/png',.95)}
    URL.revokeObjectURL(url);
    return await registerImage(uid(),blob,name,key)
  }catch(e){const heic=/hei[cf]/i.test(file.type+' '+name);throw new Error(heic?`"${esc(name)}" é HEIC/HEIF, formato que o navegador não lê. Converta para PNG ou JPG.`:`Não consegui abrir "${esc(name)}": o arquivo está corrompido ou o formato não é suportado (use PNG, JPG, WebP, GIF ou SVG).`)}}
async function addFontFile(file){
  const family=file.name.replace(/\.[^.]+$/,'').replace(/[^\w ]/g,'').trim()||'Fonte',buf=await file.arrayBuffer();
  const ff=new FontFace(family,buf);await ff.load();document.fonts.add(ff);
  const id=uid();IM[id]={id,name:file.name,type:file.type,blob:new Blob([buf]),kind:'font',family};
  try{await asSet({id,name:file.name,type:file.type,blob:IM[id].blob,kind:'font',family})}catch(e){setSaved(false)}
  S.fonts.push({id,family});return family}
async function restoreAssets(recs){
  let bad=0;await Promise.all(recs.map(async r=>{try{
    if(r.kind==='font'){const ff=new FontFace(r.family,await r.blob.arrayBuffer());await ff.load();document.fonts.add(ff);IM[r.id]={...r}}
    else await registerImage(r.id,r.blob,r.name,r.key,false)}catch(e){bad++}}));return bad}
function dropAllAssets(){for(const id in IM){if(IM[id].url)URL.revokeObjectURL(IM[id].url);delete IM[id]}}
const usedAssetIds=st=>{const s=new Set(),j=JSON.stringify(st);for(const id in IM)if(j.includes('"'+id+'"'))s.add(id);return s};

/* ================= estado ================= */
const PIRATA=[['Mar Aberto','#54b9d9',29],['Águas Amaldiçoadas','#7b22a8',13],['Ilha Tropical','#f9ea48',4],['Cemitério de Navios','#444e63',4],['Porto Pirata','#70451b',6],['Comércio','#e5473c',5],['Triângulo das Bermudas','#f2bd6b',2],['Pedra das Sereias','#ef6db8',2],['Altar da Transmutação','#9e1f63',3],['Refúgio do Mar Calmo','#d9d9d9',3]];
const newVar=(qty=1)=>({img:null,ov:null,qty,z:1,os:.7,rr:false});
const newCat=(name='Nova categoria',color='#4fb39b',qty=1)=>({id:uid(),name,color,qty,sep:false,fix:false,pos:'any',vars:[newVar(qty)]});
function defState(){return{v:2,shape:'hex',layers:4,cols:8,rn:6,rowsStr:'6,7,8,9,10,9,8,7,6',flat:false,size:34,gap:0,rad:0,ow:3,oc:'#0a121a',ostyle:'solid',
  showNums:false,numColor:'#ffffff',showLabels:false,labelSize:.3,labelColor:'#ffffff',emptyColor:'#26394a',showBack:false,back:{color:'#1d3a52',img:null},margin:40,
  bg:{color:'#1a2b38',c2:'#0d1821',grad:false,img:null,mode:'cover',z:1,x:0,y:0,op:1,blur:0},
  bd:{on:true,fit:'hex',fillOp:1,textTop:true,tg:{},ts:[],tn:[],ring:{img:null,z:1,x:0,y:0,op:1},thick:70,pad:0,color:'#0a121a',lc:'#ffffff',lw:3,cut:false,fs:22,tc:'#ffffff',font:'Cinzel',segs:[],segBg:[],sd:[],imgOri:'out',puz:false,puzShape:'round',puzSize:.5,puzFlip:false,numOn:true,numStyle:'123',numSize:.2,numOp:.75},
  cats:[],cells:[],lay:[],bgs:[],hov:[],hl:[],hlOn:true,hlTop:true,hlDef:{side:'in',col:'#39ff14',gc:'#39ff14',glow:14,glowA:.8,core:.45,cc:'#ffffff',w:5,st:'solid',dl:1,cap:'round',op:1,off:0,inset:0,join:true},ovClip:false,bgClip:false,shufRot:false,seed:2026,surplus:'biggest',fonts:[],opt:{maxImg:4096},
  exp:{wcm:60,dpi:300,transp:false,fmt:'png',pdfMode:'one',paper:'A4',pw:210,ph:297,pm:10,ov:10,marks:true,lossless:false,q:.95,hexPx:800,hexMode:'uniq',pc:{dia:4,mode:'tip',margin:8,gap:3,dpi:300,hex:true,bord:true,guide:true,nums:true,lossless:false}}}}
function deepMerge(a,b){if(!b||typeof b!=='object')return a;for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))deepMerge(a[k],b[k]);else a[k]=b[k]}return a}
function tpl(n){
  const d=defState();
  if(n==='pirata'){d.shape='rows';d.cats=PIRATA.map(([a,c,q])=>newCat(a,c,q));d.bd.segs=['Farol, Passagem A, Estaleiro','Comércio, Pedras das Sereias','Cemitério, Ossuário','Taverna, Passagem B, Capela','Peixaria, Pesqueiro','Cemitério, Ossuário']}
  else if(n==='catan'){d.shape='hex';d.layers=3;d.bg.color='#0f4c75';d.bd.color='#1f6f9f';d.bd.thick=46;d.bd.lw=0;
    d.cats=[['Floresta','#2f7d3a',4],['Pasto','#9bd05a',4],['Campo','#f0c93b',4],['Colina','#c4622d',3],['Montanha','#7d8590',3],['Deserto','#e8d9a0',1]].map(([a,c,q])=>newCat(a,c,q))}
  return d}
let userMoved=false,lastSig='';
let S=defState(),view={z:1,x:0,y:0},selSet=new Set(),selPrim=-1,selLayer=null,selSide=-1,selHl=new Set(),selTx=null,hoverEdge=null,hovOv=null,tool='hand',brush=null,tab='Mapa',msg='',rectSel=null;
let hist=[],hi=-1;
const catOf=id=>S.cats.find(c=>c.id===id);
const MAXCELLS=5000;

/* ================= geometria ================= */
function rowLens(){
  let a;
  if(S.shape==='hex'){const L=clamp(S.layers|0,1,30);a=[];for(let i=0;i<2*L-1;i++)a.push(2*L-1-Math.abs(L-1-i))}
  else if(S.shape==='rect'){a=Array.from({length:clamp(S.rn|0,1,70)},()=>clamp(S.cols|0,1,70))}
  else{a=String(S.rowsStr).split(/[,\s;]+/).map(Number).filter(n=>n>0).map(n=>Math.min(120,Math.floor(n)));if(!a.length)a=[1]}
  let t=0;const out=[];for(const n of a){if(t+n>MAXCELLS)break;out.push(n);t+=n}return out.length?out:[1]}
function layout(){
  const s=S.size,w=SQ3*s,ns=rowLens(),out=[];let sh=0,f=1;const H=(ns.length-1)*1.5*s;
  ns.forEach((n,r)=>{if(r>0&&(n-ns[r-1])%2===0){sh+=f*w/2;f=-f}
    for(let i=0;i<n;i++){const x=(i-(n-1)/2)*w+sh,y=r*1.5*s-H/2;out.push(S.flat?{x:y,y:x}:{x,y})}});
  return out}
function hull(P){
  const pts=P.map(p=>[p.x,p.y]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(pts.length<3)return pts;

function slideNum(o,k,min,max,step,after){
  const w=el('div');w.style.cssText='display:flex;gap:6px;align-items:center;flex:1;justify-content:flex-end';
  const r=el('input');r.type='range';r.min=min;r.max=max;r.step=step;r.value=o[k];r.style.cssText='flex:1;min-width:70px;width:auto';
  const n=el('input');n.type='number';n.min=min;n.max=max;n.step=step;n.value=o[k];n.style.cssText='width:66px';
  const cl=v=>Math.min(max,Math.max(min,v)),setv=v=>{o[k]=v;r.value=v;n.value=v};
  r.oninput=()=>{setv(parseFloat(r.value));after&&after();draw()};r.onchange=()=>push();
  n.oninput=()=>{const v=parseFloat(n.value);if(isNaN(v))return;o[k]=cl(v);r.value=o[k];after&&after();draw()};

    for(let r=0;r<R;r++){const sh=((r+v)%2)*px/2,n=W-sh>=w-1e-9?Math.floor((W-sh-w)/px+1e-9)+1:0;for(let j=0;j<n;j++)pts.push([sh+j*px+w/2,r*dy+h/2])}
    if(!best||pts.length>best.length)best=pts}
  return best||[]}
function hexFill(rect,count,k,sp,center){
  const s=S.size,flat=S.flat,wP=(flat?2:SQ3)*s*k,hP=(flat?SQ3:2)*s*k;
  let pts=flat?honey(rect.h,rect.w,hP,wP,sp).map(q=>[q[1],q[0]]):honey(rect.w,rect.h,wP,hP,sp);
  pts=pts.slice(0,Math.max(0,count));if(!pts.length)return[];
  let dx=0;if(center){const a=Math.min(...pts.map(q=>q[0]-wP/2)),b=Math.max(...pts.map(q=>q[0]+wP/2));dx=(rect.w-(b-a))/2-a}
  return pts.map(q=>[rect.x+q[0]+dx,rect.y+q[1]])}
/* planeja as folhas: bordas primeiro (maiores antes), depois hexágonos no favo, aproveitando os espaços que sobram */
function planOnce(diaCm,maxB){
  const C=S.exp.pc,g=geom(),s=S.size,k=C.mode==='flat'?diaCm*10/(SQ3*s):diaCm*10/(2*s),m=C.margin,PW=210-2*m,PH=297-2*m,sp=Math.max(C.gap,S.ow*k+.6),pages=[];
  const borders=[];
  if(C.bord&&g.bd)for(let i=0;i<g.bd.sides.length;i++){const fr=pframe(g.bd,i),pw=Math.max(S.bd.lw,2);borders.push({i,w:(fr.bw+2*pw)*k,h:(fr.bh+2*pw)*k})}
  const fitScale=borders.length?Math.min(1,...borders.map(b=>Math.min(PW/Math.min(b.w,b.h),PH/Math.max(b.w,b.h)))):1;
  const newPage=o=>{const W=o==='L'?297:210,H=o==='L'?210:297,pg={orient:o,W,H,items:[],free:[{x:m,y:m,w:W-2*m,h:H-2*m}]};pages.push(pg);return pg};
  const tryPlace=(pg,b)=>{let best=null;
    pg.free.forEach((F,fi)=>[[b.w,b.h,false],[b.h,b.w,true]].forEach(([ww,hh,r])=>{if(ww<=F.w+1e-6&&hh<=F.h+1e-6){const sc=Math.min(F.w-ww,F.h-hh);if(!best||sc<best.sc)best={fi,ww,hh,r,sc}}}));return best};
  const put=(pg,b,t)=>{const F=pg.free[t.fi];pg.free.splice(t.fi,1);pg.items.push({type:'bord',i:b.i,x:F.x,y:F.y,w:t.ww,h:t.hh,rot:t.r});
    const rw=F.w-t.ww-sp,rh=F.h-t.hh-sp;
    if(F.w-t.ww<F.h-t.hh){if(rw>1)pg.free.push({x:F.x+t.ww+sp,y:F.y,w:rw,h:t.hh});if(rh>1)pg.free.push({x:F.x,y:F.y+t.hh+sp,w:F.w,h:rh})}
    else{if(rh>1)pg.free.push({x:F.x,y:F.y+t.hh+sp,w:t.ww,h:rh});if(rw>1)pg.free.push({x:F.x+t.ww+sp,y:F.y,w:rw,h:F.h})}};
  if(fitScale>=1){
    borders.slice().sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h)||b.w*b.h-a.w*a.h).forEach(b=>{
      let bp=null,bt=null;pages.forEach(pg=>{if(pg.items.length>=maxB)return;const t=tryPlace(pg,b);if(t&&(!bt||t.sc<bt.sc)){bt=t;bp=pg}});
      if(!bt){const pref=b.w>=b.h?'L':'P',pg=newPage(pref);let t=tryPlace(pg,b);if(!t){pages.pop();const pg2=newPage(pref==='L'?'P':'L');t=tryPlace(pg2,b);bp=pg2}else bp=pg;bt=t}
      put(bp,b,bt)})}
  const rank=id=>S.cats.findIndex(c=>c.id===id),n=g.L.length,cells=[];
  if(C.hex)S.cells.slice(0,n).forEach((c,i)=>{if(c&&c.c)cells.push({c,i})});
  cells.sort((a,b)=>rank(a.c.c)-rank(b.c.c)||a.c.v-b.c.v||a.i-b.i);
  const nHex=cells.length;let ci=0,hexTooBig=false;
  pages.slice().forEach(pg=>{pg.free.slice().sort((a,b)=>b.w*b.h-a.w*a.h).forEach(F=>{if(ci>=nHex)return;hexFill(F,nHex-ci,k,sp,false).forEach(q=>pg.items.push({type:'hex',cell:cells[ci++],cx:q[0],cy:q[1]}))})});
  let hexPerPage=0;
  while(ci<nHex){
    const P1={x:m,y:m,w:210-2*m,h:297-2*m},L1={x:m,y:m,w:297-2*m,h:210-2*m},cp=hexFill(P1,1e9,k,sp,true).length,cl=hexFill(L1,1e9,k,sp,true).length;
    if(Math.max(cp,cl)<1){hexTooBig=true;break}
    const o=cl>cp?'L':'P',pg=newPage(o);hexPerPage=Math.max(cp,cl);
    hexFill(pg.free[0],nHex-ci,k,sp,true).forEach(q=>pg.items.push({type:'hex',cell:cells[ci++],cx:q[0],cy:q[1]}));pg.free=[]}
  return{pages,k,sp,nHex,nBord:borders.length,fitScale,hexTooBig,hexPerPage,tipCm:2*s*k/10,flatCm:SQ3*s*k/10}}
/* testa quantas bordas por folha rendem menos folhas no total e fica com o melhor arranjo */
function planPieces(diaCm){
  const g=geom(),nb=S.exp.pc.bord&&g.bd?g.bd.sides.length:0;let best=planOnce(diaCm,99);
  for(let mb=nb-1;mb>=1;mb--){const q=planOnce(diaCm,mb);if(q.pages.length<best.pages.length)best=q}
  return best}
function drawHexPiece(c,cell,idx,cx,cy,k,mm2px){
  const kp=k*mm2px,g0=S.gap,sb=S.showBack,sn=S.showNums;c.save();c.translate(cx*mm2px,cy*mm2px);c.scale(kp,kp);
  S.gap=0;S.showBack=false;
  try{drawCell(c,{x:0,y:0},cell,sn?idx:-1,idx);
    if(!sn&&S.exp.pc.nums){c.font=`700 ${S.size*.2}px Arial,Helvetica,sans-serif`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=S.size*.05;c.strokeStyle='rgba(0,0,0,.7)';c.fillStyle='#ffffff';c.strokeText(String(idx+1),0,S.size*.6);c.fillText(String(idx+1),0,S.size*.6)}}
  finally{S.gap=g0;S.showBack=sb}
  c.restore()}
function drawBorderPiece(c,g,it,k,mm2px){
  const fr=pframe(g.bd,it.i),pw=Math.max(S.bd.lw,2),Ht=fr.bh+2*pw;
  c.save();c.translate(it.x*mm2px,it.y*mm2px);c.scale(k*mm2px,k*mm2px);
  if(it.rot){c.translate(Ht,0);c.rotate(Math.PI/2)}
  c.translate(pw-fr.minU,pw-fr.minV);c.rotate(-fr.ang);
  pieceFill(c,g,it.i,{base:true,cut:true,exp:true});pieceText(c,g,it.i,{noflip:true});c.restore()}
async function exportPiecesPDF(){
  const C=S.exp.pc,g=geom();let dia=C.dia,plan=planPieces(dia);
  if(plan.fitScale<1){
    const nd=Math.floor(dia*plan.fitScale*0.995*100)/100;
    if(!confirm(`Com hexágonos de ${dia} cm, a maior borda não cabe numa folha A4. Reduzir o hexágono para ${nd} cm para tudo caber? (Cancelar interrompe a geração.)`))return;
    dia=nd;plan=planPieces(dia)}
  if(plan.hexTooBig){toast('O hexágono é maior que a área útil da folha A4. Reduza o diâmetro ou a margem.','bad',9000);return}
  if(!plan.nHex&&!plan.nBord){toast('Não há peças para gerar (hexágonos preenchidos ou bordas).','bad');return}
  const pr=progress('Gerando o PDF das peças…'),dpi=clamp(C.dpi,100,600),mm2px=dpi/25.4,pt=72/25.4,pdf=[],saved={sn:S.showNums,sb:S.showBack};
  try{
    await prepExport();ORIG=true;const total=plan.pages.length+(C.guide?1:0);let done=0;
    const addPage=async(W,H,draw,caption)=>{
      chk(pr);const cvs=document.createElement('canvas');cvs.width=Math.round(W*mm2px);cvs.height=Math.round(H*mm2px);
      const c=cvs.getContext('2d',{willReadFrequently:!!C.lossless});if(!c)throw new Error('Sem memória para criar a folha. Reduza o DPI.');
      c.fillStyle='#ffffff';c.fillRect(0,0,cvs.width,cvs.height);c.imageSmoothingQuality='high';draw(c);
      let bytes,kind;
      if(C.lossless){const d=c.getImageData(0,0,cvs.width,cvs.height).data,raw=new Uint8Array(cvs.width*cvs.height*3);for(let i=0,j=0;i<d.length;i+=4,j+=3){raw[j]=d[i];raw[j+1]=d[i+1];raw[j+2]=d[i+2]}bytes=await deflate(raw);kind='flate'}
      else{bytes=new Uint8Array(await(await blobOf(cvs,'image/jpeg',.95)).arrayBuffer());kind='jpeg'}
      pdf.push({w:W*pt,h:H*pt,unit:1,imgs:[{kind,bytes,wpx:cvs.width,hpx:cvs.height,x:0,y:0,w:W*pt,h:H*pt}],texts:[{x:Math.max(C.margin,6)*pt,y:2.5*pt,size:7,s:caption}]});
      done++;pr.set(done/total*.97,`Folha ${done} de ${total}`);await sleep(0)};
    if(C.guide){
      const b=g.b,o=b.w>b.h?'L':'P',W=o==='L'?297:210,H=o==='L'?210:297,m=Math.max(C.margin,6),aw=(W-2*m)*mm2px,ah=(H-2*m-6)*mm2px,sc=Math.min(aw/b.w,ah/b.h);
      await addPage(W,H,c=>{c.save();c.translate((W*mm2px-b.w*sc)/2,m*mm2px+(ah-b.h*sc)/2);c.scale(sc,sc);c.translate(-b.x,-b.y);S.showNums=true;S.showBack=false;try{renderScene(c,g,{})}finally{S.showNums=saved.sn;S.showBack=saved.sb}c.restore()},
        `Guia de montagem - os numeros indicam a posicao de cada hexagono no mapa - folha 1 de ${total}`)}
    for(let pi=0;pi<plan.pages.length;pi++){
      const pg=plan.pages[pi],nh=pg.items.filter(x=>x.type==='hex').length,nb=pg.items.filter(x=>x.type==='bord').length;
      await addPage(pg.W,pg.H,c=>{pg.items.forEach(it=>{if(it.type==='hex')drawHexPiece(c,it.cell.c,it.cell.i,it.cx,it.cy,plan.k,mm2px);else drawBorderPiece(c,g,it,plan.k,mm2px)})},
        `Folha ${done+1} de ${total} - ${nh} hexagonos${nb?` e ${nb} borda(s)`:''} - hexagono de ${(plan.tipCm).toFixed(2)} cm de ponta a ponta`)}
    chk(pr);const blob=buildPDF(pdf);download(blob,'pecas.pdf');
    toast(`PDF das peças gerado: ${total} folha(s) A4, ${plan.nHex} hexágono(s) e ${plan.nBord} borda(s), ${(blob.size/1048576).toFixed(1)} MB. Imprima em 100% (tamanho real), sem "ajustar à página".`,'ok',12000)}
  catch(e){if(e!=='cancel')toast('Não foi possível gerar o PDF das peças: '+esc(e.message||e),'bad',9000)}
  finally{ORIG=false;S.showNums=saved.sn;S.showBack=saved.sb;pr.close()}}
function tExp(p){
  const E=S.exp;
  p.append(field('Largura do mapa (cm)',inp(E,'wcm','number',{min:2,max:2000,step:.5},()=>info())),field('Resolução (DPI)',inp(E,'dpi','number',{min:30,max:1200},()=>info())));
  const i=el('div','note');i.id='info';p.append(i);

    i.innerHTML=`Tamanho final: <b>${d.W} × ${d.H} px</b> (${E.wcm} × ${hcm} cm, ${(d.W*d.H/1e6).toFixed(0)} megapixels)`+(d.err?`<br><span class="bad">${d.err}</span>`:'')+(Math.max(E.wcm,+hcm)>508?'<br>PDF de página única: acima de 508 cm a página sai em escala reduzida (o aviso mostra quanto).':'')}

  p.append(el('h3',null,'PNG'),field('Fundo transparente',inp(E,'transp','checkbox')),el('div','note','Gerado em faixas, sem limite de tamanho do canvas do navegador; o DPI fica gravado no arquivo para impressão.'));
  addRow(p,btn('Baixar PNG',exportPNG,'pri'));
  p.append(el('h3',null,'PDF'),field('Modo',sel_(E,'pdfMode',[['one','Uma página com o mapa inteiro'],['pages','Dividir em páginas (imprimir em partes)']],()=>renderPanel())));
  if(E.pdfMode==='pages'){p.append(field('Papel',sel_(E,'paper',[...Object.keys(PAPERS).map(k=>[k,k]),['Personalizado','Personalizado']],()=>renderPanel())));
    if(E.paper==='Personalizado')p.append(field('Largura do papel (mm)',inp(E,'pw','number',{min:50,max:2000})),field('Altura do papel (mm)',inp(E,'ph','number',{min:50,max:2000})));
    p.append(field('Margem (mm)',inp(E,'pm','number',{min:0,max:50})),field('Sobreposição entre páginas (mm)',inp(E,'ov','number',{min:0,max:50})),field('Marcas de corte e legenda',inp(E,'marks','checkbox')))}
  p.append(field('Sem perdas (arquivo maior)',inp(E,'lossless','checkbox',{},()=>renderPanel())));
  if(!E.lossless)p.append(field('Qualidade JPEG (0.5–1)',inp(E,'q','number',{min:.5,max:1,step:.01})));
  p.append(el('div','note','O PDF contém a imagem em alta resolução (não vetorial). O formato PDF limita a página a 5,08 m; acima disso use "Dividir em páginas" ou o PNG.'));
  addRow(p,btn('Baixar PDF',exportPDF,'pri'));
  p.append(el('h3',null,'Peças soltas e dados'),field('Largura de cada peça (px)',inp(E,'hexPx','number',{min:100,max:4000,step:50})),field('Quais peças',sel_(E,'hexMode',[['uniq','Uma por categoria/variação'],['all','Todas as posições do mapa']])));
  addRow(p,btn('Baixar peças (.zip de PNGs)',exportHexZip),btn('Peças das bordas (.zip)',exportBorderZip),btn('Lista de peças (CSV)',exportCSV));
  p.append(el('div','note','Projeto completo (com as imagens) fica em "Salvar projeto" no topo.'));
  p.append(el('h3',null,'Todas as peças separadas (PDF em folhas A4)'));
  const C=E.pc;
  p.append(field('Diâmetro do hexágono (cm)',inp(C,'dia','number',{min:1,max:25,step:.1},()=>pcInfo())),
    field('Diâmetro medido',sel_(C,'mode',[['tip','De ponta a ponta'],['flat','De lado a lado']],()=>pcInfo())),
    field('Margem da folha (mm)',inp(C,'margin','number',{min:3,max:30,step:.5},()=>pcInfo())),
    field('Espaço entre as peças (mm)',inp(C,'gap','number',{min:1,max:20,step:.5},()=>pcInfo())),
    field('Resolução (DPI)',inp(C,'dpi','number',{min:100,max:600,step:25})),
    field('Incluir hexágonos',inp(C,'hex','checkbox',{},()=>pcInfo())),
    field('Incluir bordas',inp(C,'bord','checkbox',{},()=>pcInfo())),
    field('Folha-guia com o mapa montado',inp(C,'guide','checkbox',{},()=>pcInfo())),
    field('Número da posição em cada hexágono',inp(C,'nums','checkbox')),
    field('Sem perdas (arquivo maior)',inp(C,'lossless','checkbox')));
  const pi=el('div','note');pi.id='pcinfo';p.append(pi);
  function pcInfo(){
    const pl=planPieces(C.dia),pages=pl.pages.length+(C.guide?1:0);
    pi.innerHTML=`<b>${pl.nHex}</b> hexágono(s) e <b>${pl.nBord}</b> borda(s) em <b>${pages}</b> folha(s) A4${C.guide?' (contando a folha-guia)':''}. Hexágono: <b>${pl.tipCm.toFixed(2)} cm</b> de ponta a ponta, <b>${pl.flatCm.toFixed(2)} cm</b> de lado a lado.`
      +(pl.hexPerPage?` Cabem até ${pl.hexPerPage} hexágonos por folha cheia.`:'')
      +(pl.fitScale<1?`<br><span class="bad">A maior borda não cabe numa folha A4 com esse tamanho. Ao gerar, será oferecido reduzir o hexágono para ${(Math.floor(C.dia*pl.fitScale*0.995*100)/100)} cm.</span>`:'')
      +(pl.hexTooBig?'<br><span class="bad">O hexágono é maior que a área útil da folha.</span>':'')}
  pcInfo();
  addRow(p,btn('Gerar PDF das peças',exportPiecesPDF,'pri'));
  p.append(el('div','note','Cada peça sai no tamanho real, com o contorno de corte. As bordas vêm primeiro e os hexágonos preenchem o restante de cada folha em arranjo de favo, agrupados por categoria; a folha-guia mostra o mapa montado com os números. Imprima em 100%, sem ajustar à página.'))}

  S=tpl(b.dataset.tpl);msg='';ensureCells();selSet.clear();selLayer=null;selSide=-1;selHl.clear();selTx=null;hist=[];hi=-1;$('#dlgNew').close();
